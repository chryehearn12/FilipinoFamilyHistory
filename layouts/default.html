<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
  <!-- Optional: Fuse.js CDN for fuzzy searching (not used by default script) -->
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1 class="site-title">{{ site.title | default: "My Site" }}</h1>
      <nav class="top-nav">
        <a href="{{ '/' | relative_url }}">Home</a> |
        <a href="{{ '/search.html' | relative_url }}">Search</a> |
        <a href="{{ '/about' | relative_url }}">About</a>
      </nav>
    </div>
  </header>

  <div class="site-body">
    <aside class="site-sidebar">
      <div class="sidebar-box">
        <img src="{{ '/assets/images/placeholder.jpg' | relative_url }}" alt="" class="sidebar-image" />
        <ul class="sidebar-nav">
          <li><a href="{{ '/' | relative_url }}">Home</a></li>
          <li><a href="{{ '/parish-records' | relative_url }}">Parish Records</a></li>
          <li><a href="{{ '/baptisms' | relative_url }}">Baptisms</a></li>
          <li><a href="{{ '/marriages' | relative_url }}">Marriages</a></li>
          <li><a href="{{ '/burials' | relative_url }}">Burials</a></li>
        </ul>
      </div>
    </aside>

    <main class="site-main">
      {{ content }}
    </main>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <small>© {{ site.time | date: "%Y" }} {{ site.title }}</small>
    </div>
  </footer>

  <script src="{{ '/assets/js/search.js' | relative_url }}"></script>
</body>
</html>
