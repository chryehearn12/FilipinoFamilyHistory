<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baptism Records – Filipino Family History</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f5f5;
}

.layout {
  display: flex;
  min-height: 100vh;
}

/* Sidebar */
.sidebar {
  width: 220px;
  background: #2c2c2c;
  color: white;
  padding: 20px;
}

.sidebar h2 {
  font-size: 18px;
  margin-bottom: 15px;
}

.sidebar a {
  display: block;
  color: white;
  text-decoration: none;
  margin-bottom: 10px;
}

.sidebar a:hover {
  text-decoration: underline;
}

/* Main content */
.main {
  flex: 1;
  padding: 30px;
  background: white;
}

h1 {
  margin-top: 0;
}

.search-form {
  margin-bottom: 20px;
}

.search-form input {
  padding: 8px;
  font-size: 16px;
  width: 300px;
}

/* Table */
table {
  width: 100%;
  border-collapse: collapse;
  display: none;
}

th, td {
  border: 1px solid #ccc;
  padding: 8px;
  text-align: left;
}

th {
  background: #eee;
}

#noResults {
  display: none;
  margin-top: 20px;
  color: #777;
}
</style>
</head>

<body>

<div class="layout">

  <div class="sidebar">
    <h2>Filipino Family History</h2>
    <a href="index.html">Home</a>
    <a href="search.html">General Search</a>
    <a href="burials.html">Burial Records</a>
    <a href="baptisms.html">Baptism Records</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </div>

  <div class="main">
    <h1>Baptism Records</h1>

    <div class="search-form">
      <input type="text" id="searchInput" placeholder="Search any field...">
    </div>

    <table id="resultsTable">
      <thead>
        <tr>
          <th>Surname</th>
          <th>Given Name</th>
          <th>Year</th>
          <th>Mother</th>
          <th>Father</th>
          <th>Parish</th>
          <th>Place</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div id="noResults">No results found.</div>

  </div>
</div>

<script>
let records = [];

fetch("baptisms.csv")
  .then(res => res.text())
  .then(text => {
    records = text.trim().split("\n").slice(1).map(row => row.split(","));
  });

document.getElementById("searchInput").addEventListener("input", function () {
  const term = this.value.toLowerCase();
  const tbody = document.querySelector("#resultsTable tbody");

  tbody.innerHTML = "";

  if (!term) {
    document.getElementById("resultsTable").style.display = "none";
    document.getElementById("noResults").style.display = "none";
    return;
  }

  let matches = 0;

  records.forEach(cols => {
    if (cols.some(col => col.toLowerCase().includes(term))) {
      const tr = document.createElement("tr");
      cols.forEach(col => {
        const td = document.createElement("td");
        td.textContent = col;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
      matches++;
    }
  });

  document.getElementById("resultsTable").style.display = matches ? "table" : "none";
  document.getElementById("noResults").style.display = matches ? "none" : "block";
});
</script>

</body>
</html>
