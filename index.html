<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Philippine Genealogy Index</title>
<style>
body { font-family: Arial, sans-serif; }
.search { background:#d8c6a3; padding:10px; }
.search input { margin:5px; padding:5px; }
table { border-collapse: collapse; width:100%; margin-top:10px; }
th, td { border:1px solid #999; padding:6px; }
</style>
</head>

<body>

<h2>Search Records</h2>

<div class="search">
  <input id="given" placeholder="Forename">
  <input id="surname" placeholder="Surname">
  <input id="year" placeholder="Year">
  <input id="parish" placeholder="Parish">
  <input id="province" placeholder="Place">
  <button onclick="search()">Search</button>
</div>

<table>
<thead>
<tr>
  <th>Name</th>
  <th>Event</th>
  <th>Year</th>
  <th>Parish</th>
  <th>Place</th>
</tr>
</thead>
<tbody id="results"></tbody>
</table>

<script>
let data = [];

fetch("records.csv")
.then(r => r.text())
.then(text => {
  const rows = text.split("\n").slice(1);
  rows.forEach(row => {
    const cols = row.split(",");
    data.push({
      given: cols[0],
      surname: cols[1],
      event: cols[2],
      year: cols[3],
      parish: cols[4],
      place: cols[5]
    });
  });
});

function search() {
  const g = given.value.toLowerCase();
  const s = surname.value.toLowerCase();
  const y = year.value;
  const p = parish.value.toLowerCase();
  const pr = place.value.toLowerCase();

  results.innerHTML = "";

  data.filter(r =>
    (!g || r.given.toLowerCase().includes(g)) &&
    (!s || r.surname.toLowerCase().includes(s)) &&
    (!y || r.year === y) &&
    (!p || r.parish.toLowerCase().includes(p)) &&
    (!pr || r.place.toLowerCase().includes(pr))
  ).forEach(r => {
    results.innerHTML += `
      <tr>
        <td>${r.given} ${r.surname}</td>
        <td>${r.event}</td>
        <td>${r.year}</td>
        <td>${r.parish}</td>
        <td>${r.place}</td>
      </tr>`;
  });
}
</script>

</body>
</html>
