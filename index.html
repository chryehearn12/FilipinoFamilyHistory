<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Filipino Genealogy Search</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      text-align: center;
    }

    input[type="file"], input[type="text"] {
      display: block;
      margin: 10px 0;
      padding: 8px;
      width: 100%;
      box-sizing: border-box;
      font-size: 16px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }

    th {
      background-color: #f4f4f4;
    }

    tr:nth-child(even) {
      background-color: #fafafa;
    }

    tr.hidden {
      display: none;
    }
  </style>
</head>
<body>

  <h1>Filipino Genealogy Search</h1>

  <input type="file" id="csvFile" accept=".csv" />
  <input type="text" id="searchInput" placeholder="Search by any column" />

  <table id="genealogyTable">
    <thead>
      <tr>
        <th>Given Name</th>
        <th>Surname</th>
        <th>Event</th>
        <th>Year</th>
        <th>Parish</th>
      </tr>
    </thead>
    <tbody>
      <!-- Rows will appear here after uploading CSV -->
    </tbody>
  </table>

  <script>
    const fileInput = document.getElementById('csvFile');
    const tableBody = document.querySelector('#genealogyTable tbody');
    const searchInput = document.getElementById('searchInput');

    // Load CSV and populate table
    fileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const text = e.target.result;
        const rows = text.trim().split('\n').map(r => r.split(','));
        tableBody.innerHTML = '';

        rows.forEach((row, index) => {
          if (index === 0) return; // skip header row
          const tr = document.createElement('tr');
          row.forEach(cell => {
            const td = document.createElement('td');
            td.textContent = cell;
            tr.appendChild(td);
          });
          tableBody.appendChild(tr);
        });
      };
      reader.readAsText(file);
    });

    // Search/filter table
    searchInput.addEventListener('input', function() {
      const searchTerm = this.value.toLowerCase();
      const rows = tableBody.querySelectorAll('tr');

      rows.forEach(row => {
        const text = row.textContent.toLowerCase();
        row.classList.toggle('hidden', !text.includes(searchTerm));
      });
    });
  </script>

</body>
</html>

</body>
</html>
