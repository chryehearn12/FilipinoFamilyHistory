<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Filipino Genealogy Search</title>
<style>
body { font-family: Arial; background: #f7f7f7; padding: 20px; }
.container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow:0 0 10px rgba(0,0,0,0.1);}
h1 { text-align:center; margin-bottom:20px; }
.search-form { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:20px;}
#searchInput { padding:8px; font-size:16px; width:300px; border:1px solid #ccc; border-radius:4px; }
#searchBtn { padding:8px 12px; font-size:16px; border:none; background:#d32f2f; color:white; border-radius:4px; cursor:pointer;}
#searchBtn:hover { background:#b71c1c;}
table { width:100%; border-collapse:collapse; display:none;}
th, td { padding:10px; border:1px solid #ddd; text-align:left;}
th { background:#f2f2f2;}
tr:hover { background:#f9f9f9;}
#noResults { text-align:center; margin-top:10px; display:none; color:#777;}
</style>
</head>
<body>
<div class="container">
<h1>Filipino Genealogy Search</h1>

<input type="file" id="csvFile" accept=".csv">

<div class="search-form">
<input type="text" id="searchInput" placeholder="Search by any field">
<button id="searchBtn">Search</button>
</div>

<table id="resultsTable">
<thead>
<tr>
<th>Given Name</th>
<th>Surname</th>
<th>Event</th>
<th>Year</th>
<th>Parish</th>
<th>Place</th>
</tr>
</thead>
<tbody></tbody>
</table>
<div id="noResults">No results found.</div>
</div>

<script>
// Robust CSV parser handling quotes
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const headers = lines[0].split(',').map(h=>h.trim().toLowerCase().replace(' ','_'));
  return lines.slice(1).map(line => {
    const regex = /(".*?"|[^",\s]+)(?=\s*,|\s*$)/g;
    const values = [...line.matchAll(regex)].map(m => m[0].replace(/^"|"$/g,''));
    const obj = {};
    headers.forEach((h,i)=>obj[h]=values[i]||'');
    return obj;
  });
}

let data = [];

document.getElementById('csvFile').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    data = parseCSV(e.target.result);
    document.querySelector('#resultsTable tbody').innerHTML='';
    document.getElementById('resultsTable').style.display='none';
    document.getElementById('noResults').style.display='none';
  };
  reader.readAsText(file);
});

document.getElementById('searchBtn').addEventListener('click', ()=>{
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  if(!query){ document.getElementById('resultsTable').style.display='none'; document.getElementById('noResults').style.display='none'; return;}
  const filtered = data.filter(row=>Object.values(row).some(v=>v.toLowerCase().includes(query)));
  renderTable(filtered);
});

function renderTable(rows){
  const tbody = document.querySelector('#resultsTable tbody');
  tbody.innerHTML='';
  if(rows.length===0){ document.getElementById('resultsTable').style.display='none'; document.getElementById('noResults').style.display='block'; return;}
  rows.forEach(r=>{
    const tr = document.createElement('tr');
    ['given_name','surname','event','year','parish','place'].forEach(k=>{
      const td = document.createElement('td'); td.textContent=r[k]||''; tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  document.getElementById('resultsTable').style.display='table';
  document.getElementById('noResults').style.display='none';
}
</script>
</body>
</html>

</body>
</html>
