<!DOCTYPE html>
<html>
<head>
  <title>Filipino Genealogy Search</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    input, button { padding: 5px; margin: 5px 0; }
    li { margin: 3px 0; }
  </style>
</head>
<body>

<h1>Filipino Genealogy Search</h1>

<input type="file" id="csvFile" accept=".csv">
<br>
<input type="text" id="searchInput" placeholder="Search by surname or given name">
<ul id="results"></ul>

<script>
let data = [];

// Function to parse CSV
function parseCSV(text) {
  const lines = text.split('\n').filter(l => l.trim() !== '');
  const header = lines[0].split(',').map(h => h.trim());
  return lines.slice(1).map(line => {
    // Handle commas inside quotes
    const values = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g).map(v => v.replace(/^"|"$/g,''));
    const obj = {};
    header.forEach((h, i) => obj[h] = values[i] || '');
    return obj;
  });
}

// Handle CSV upload
document.getElementById('csvFile').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    data = parseCSV(e.target.result);
    document.getElementById('results').innerHTML = '';
    alert(`CSV loaded! ${data.length} records ready to search.`);
  }
  reader.readAsText(file);
});

// Handle search
document.getElementById('searchInput').addEventListener('input', function() {
  const search = this.value.toLowerCase();
  const resultsEl = document.getElementById('results');
  resultsEl.innerHTML = '';
  if (!search) return;
  data.filter(row => 
      row.surname.toLowerCase().includes(search) || 
      row.given_name.toLowerCase().includes(search)
    ).forEach(row => {
      const li = document.createElement('li');
      li.textContent = `${row.given_name} ${row.surname} — ${row.event}, ${row.year}, ${row.parish}, ${row.place}`;
      resultsEl.appendChild(li);
    });
});
</script>

</body>
</html>
