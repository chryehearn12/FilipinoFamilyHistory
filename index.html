<!DOCTYPE html>
<html>
<head>
  <title>Filipino Genealogy Search</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    input, button { padding: 5px; margin: 5px 0; }
    ul { list-style: none; padding-left: 0; }
    li { margin: 3px 0; cursor: pointer; }
    li:hover { background-color: #eee; }
  </style>
</head>
<body>

<h1>Filipino Genealogy Search</h1>

<input type="file" id="csvFile" accept=".csv">
<br>
<input type="text" id="searchInput" placeholder="Search by surname">
<ul id="suggestions"></ul>
<ul id="results"></ul>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
let data = [];
let uniqueSurnames = [];

// Clean keys and values from quotes/spaces
function cleanRow(row) {
  const clean = {};
  Object.keys(row).forEach(k => {
    const key = k.trim().replace(/^"|"$/g,'');
    const value = row[k] ? row[k].trim().replace(/^"|"$/g,'') : '';
    clean[key] = value;
  });
  return clean;
}

// CSV upload
document.getElementById('csvFile').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;

  Papa.parse(file, {
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      data = results.data.map(cleanRow);
      // create list of unique surnames for suggestions
      const surnames = data.map(r => r.surname).filter(Boolean);
      uniqueSurnames = [...new Set(surnames)].sort();
      document.getElementById('results').innerHTML = '';
      document.getElementById('suggestions').innerHTML = '';
      alert(`CSV loaded! ${data.length} records ready to search.`);
    }
  });
});

// Show results for a surname
function showResults(surname) {
  const resultsEl = document.getElementById('results');
  resultsEl.innerHTML = '';
  data.filter(row => row.surname && row.surname.toLowerCase() === surname.toLowerCase())
      .forEach(row => {
        const li = document.createElement('li');
        li.textContent = `${row.given_name} ${row.surname} — ${row.event}, ${row.year}, ${row.parish}, ${row.place}`;
        resultsEl.appendChild(li);
      });
}

// Auto-suggestions
document.getElementById('searchInput').addEventListener('input', function() {
  const input = this.value.toLowerCase();
  const suggestionsEl = document.getElementById('suggestions');
  suggestionsEl.innerHTML = '';
  if (!input) return;

  uniqueSurnames.filter(s => s.toLowerCase().startsWith(input))
      .forEach(s => {
        const li = document.createElement('li');
        li.textContent = s;
        li.addEventListener('click', () => {
          document.getElementById('searchInput').value = s;
          suggestionsEl.innerHTML = '';
          showResults(s);
        });
        suggestionsEl.appendChild(li);
      });
});
</script>

</body>
</html>
