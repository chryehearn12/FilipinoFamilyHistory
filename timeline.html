<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Timeline - Filipino Genealogy</title>
  <style>
    /* Base styles */
    body { margin:0; font-family:Arial; background:#f7f7f7; }
    
    /* Wrapper and layout */
    .wrapper{display:flex; min-height:100vh;}
    .sidebar{
      width:220px;
      background:#d32f2f;
      color:white;
      flex-shrink:0;
      display:flex;
      flex-direction:column;
      padding-top:20px;
    }
    .sidebar h2{text-align:center; margin-bottom:20px; font-size:18px;}
    .sidebar a{
      padding:12px 20px; display:block; color:white;
      border-bottom:1px solid rgba(255,255,255,0.1);
      text-decoration:none;
    }
    .sidebar a:hover{background:#b71c1c;}
    
    .main{
      flex:1;
      padding:20px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    /* Timeline container */
    .timeline-container {
      width: 100%;
      max-width: 800px;
      overflow: visible;  /* allow events to be fully visible */
      position: relative;
      margin-top: 30px;
      padding-top: 40px; /* space for event boxes above timeline line */
    }

    /* Timeline line */
    .timeline {
      position: relative;
      height: 8px; /* line thickness */
      background: #eee;
      border-radius: 4px;
      white-space: nowrap;
      transition: transform 0.3s;
    }

    /* Event boxes */
    .event {
      position: absolute;
      top: -30px; /* place event text above the line */
      transform: translateY(0);
      background: #ff4c4c;
      color: white;
      padding: 5px 10px;
      border-radius: 5px;
      white-space: nowrap;
      transition: background 0.3s;
    }

    /* Slider */
    #slider {
      width: 100%;
      margin-top: 60px;
    }

    /* Responsive */
    @media(max-width:768px){
      .wrapper{flex-direction:column;}
      .sidebar{width:100%; flex-direction:row; overflow-x:auto;}
      .sidebar a{flex:1; text-align:center; border-bottom:none; border-right:1px solid rgba(255,255,255,0.2);}
      .sidebar a:last-child{border-right:none;}
      .timeline-container{width:95%; padding-top:50px;}
      .event{top:-35px;}
    }
  </style>
</head>
<body>

<div class="wrapper">
  <!-- Sidebar -->
  <div class="sidebar">
    <h2>Menu</h2>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="baptism.html">Baptism Records</a>
    <a href="confirmation.html">Confirmation Records</a>
    <a href="marriage.html">Marriage Records</a>
    <a href="death.html">Death Records</a>
    <a href="burial.html">Burial Records</a>
    <a href="timeline.html">Timeline</a>
    <a href="contact.html">Contact</a>
  </div>

  <!-- Main content -->
  <div class="main">
    <h1>Historical Timeline</h1>
    <div class="timeline-container">
      <div class="timeline" id="timeline">
        <div class="event" style="left:0%">1521: Ferdinand Magellan</div>
        <div class="event" style="left:100%">1849: Claveria Decree</div>
      </div>
      <input type="range" id="slider" min="0" max="100" value="0">
    </div>
  </div>
</div>

<!-- JavaScript -->
<script>
  const slider = document.getElementById('slider');
  const timeline = document.getElementById('timeline');
  const events = document.querySelectorAll('.event');

  slider.addEventListener('input', () => {
    const value = slider.value; // 0 to 100
    // Move timeline within container only
    timeline.style.transform = `translateX(-${value}%)`;

    // Highlight events that have been passed
    events.forEach(event => {
      const eventLeft = parseFloat(event.style.left);
      if (eventLeft <= value) {
        event.style.background = '#4CAF50'; // reached
      } else {
        event.style.background = '#ff4c4c'; // upcoming
      }
    });
  });
</script>

</body>
</html>
