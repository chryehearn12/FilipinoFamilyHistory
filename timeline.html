<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline Slider</title>
  <style>
.timeline-container {
  width: 80%;
  margin: 50px auto;
  position: relative;
}

.timeline {
  position: relative;
  height: 60px;
  background: #eee;
  border-radius: 30px;
  overflow: hidden;
}

.event {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: #ff4c4c;
  color: white;
  padding: 5px 10px;
  border-radius: 5px;
  white-space: nowrap;
  transition: background 0.3s;
}

#slider {
  width: 100%;
  margin-top: 30px;
}
  </style>
</head>
<body>
<div class="timeline-container">
  <div class="timeline" id="timeline">
    <div class="event" style="left:0%">1521: Ferdinand Magellan</div>
    <div class="event" style="left:100%">1849: Claveria Decree</div>
  </div>
  <input type="range" id="slider" min="0" max="100" value="0">
</div>

  <script>
const slider = document.getElementById('slider');
const timeline = document.getElementById('timeline');
const events = document.querySelectorAll('.event');

slider.addEventListener('input', () => {
  const value = slider.value; // 0 to 100
  // Move timeline (simulate sliding)
  timeline.style.transform = `translateX(-${value}%)`;

  // Highlight events passed
  events.forEach(event => {
    const eventLeft = parseFloat(event.style.left);
    if (eventLeft <= value) {
      event.style.background = '#4CAF50'; // event reached
    } else {
      event.style.background = '#ff4c4c'; // upcoming
    }
  });
});
  </script>
</body>
</html>
